name: Tom's lottery results
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tom/refresh-lottery.py'
      - '.github/workflows/tom-lottery.yml'
permissions:
  contents: write
concurrency:
  group: tom-lottery-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read official Michigan Lottery results
        run: python3 tom/refresh-lottery.py
      - name: Save verified results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,os,urllib.request
          endpoint='https://api.github.com/repos/'+os.environ['GH_REPO']+'/contents/tom/lottery.json'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(endpoint,headers=headers)) as r: old=json.load(r)
          content=open('tom/lottery.json','rb').read()
          payload={'message':'Update Tom’s official lottery results','content':base64.b64encode(content).decode(),'sha':old['sha']}
          req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r: print('Saved verified lottery results')
          PY
